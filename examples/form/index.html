<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form extraction example</title><style>body{font:16px system-ui;max-width:700px;margin:32px auto;padding:0 16px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:7px}pre{white-space:pre-wrap;background:#f3f5f8;padding:12px}</style></head><body><h1>Form extraction</h1><p>Submit to extract named control values using instructions.</p><form id="form"><label>Name <input name="name" value="Maya"></label><label>Email <input name="email" type="email" value="maya@example.com"></label><label>Role <select name="role"><option>Analyst</option><option selected>Developer</option></select></label><label><input type="checkbox" name="subscribe" value="yes" checked> Subscribe</label><label>Notes <textarea name="notes">Example note</textarea></label><button>Collect form data</button></form><h2>Result</h2><pre id="out">Submit the form.</pre><script type="module">import {collectFormData} from './howToCall.js';const f=document.querySelector('#form'),o=document.querySelector('#out');f.addEventListener('submit',e=>{e.preventDefault();o.textContent=JSON.stringify(collectFormData(e),null,2)});</script></body></html>
