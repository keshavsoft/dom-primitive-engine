      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    .nav-links {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .nav-links a {
      font-size: 0.85rem;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .nav-links a.active {
      color: #0f172a;
      text-decoration: underline;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1e293b;
      transition: border-color 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    button[type="submit"] {
      padding: 12px 18px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s ease;
    }
    button[type="submit"]:hover {
      background: #1d4ed8;
    }
    .output-section {
      margin-top: 24px;
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }
    .output-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
    }
    pre {
      background: #0f172a;
      color: #38bdf8;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

<body>
  <div class="card">
    <div class="nav-links">
      <a href="./form.html" class="active">Form Sample</a>
      <span>•</span>
      <a href="./table.html">Table & Footer Sample →</a>
    </div>

    <span class="badge">V7 Pipeline</span>
    <h1>Form Extraction</h1>
    <p class="subtitle">Extracts Name & Mobile into an object on button click</p>

    <form id="v7Form" onsubmit="return false;">
      <div class="field">
        <label for="nameInput">Name</label>
        <input id="nameInput" name="name" type="text" placeholder="Enter name" value="Keshav" required>
      </div>

      <div class="field">
        <label for="mobileInput">Mobile Number</label>
        <input id="mobileInput" name="mobile" type="tel" placeholder="Enter mobile" value="9876543210" required>
      </div>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <div class="output-section">
      <div class="output-label">Extracted Form Object (Console & DOM)</div>
      <pre id="outputResult">// Click Submit to extract form data</pre>
    </div>
  </div>

</body>
