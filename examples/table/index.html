<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table extraction example</title><style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 16px}table{border-collapse:collapse;width:100%;margin:16px 0}td,th{border:1px solid #aaa;padding:8px;text-align:left}input,select,button{font:inherit;padding:6px}pre{white-space:pre-wrap;background:#f3f5f8;padding:12px}</style></head><body><h1>Table row and cell extraction</h1><p>Try Save row, Options, or click a cell.</p><table id="people"><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Actions</th></tr></thead><tbody><tr data-id="101"><td>101</td><td><input name="name" value="Maya"></td><td><select name="role"><option selected>Developer</option><option>Analyst</option></select></td><td><button class="save" type="button">Save row</button> <button class="options" type="button">Options</button></td></tr><tr data-id="102"><td>102</td><td><input name="name" value="Arun"></td><td><select name="role"><option>Developer</option><option selected>Analyst</option></select></td><td><button class="save" type="button">Save row</button> <button class="options" type="button">Options</button></td></tr></tbody></table><h2>Result</h2><pre id="out">Choose an action.</pre><script type="module">import {collectRow,readRowCells,readClickedCell} from './howToCall.js';const t=document.querySelector('#people'),o=document.querySelector('#out');t.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.classList.contains('save'))o.textContent=JSON.stringify({action:'save-row',rowId:b.closest('tr').dataset.id,data:collectRow({currentTarget:b})},null,2);else if(b?.classList.contains('options'))o.textContent=JSON.stringify({action:'options',rowId:b.closest('tr').dataset.id,cells:readRowCells({currentTarget:b})},null,2);else{const td=e.target.closest('td');if(td&&t.contains(td))o.textContent=JSON.stringify({action:'cell-click',text:readClickedCell({currentTarget:td})},null,2)}});</script></body></html>
