<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V8 — Form Primitive Extraction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    .nav-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }
    .nav-bar a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .nav-bar a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1e293b;
      background: #ffffff;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    button[type="submit"] {
      padding: 12px 18px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s ease;
    }
    button[type="submit"]:hover { background: #1d4ed8; }
    .output-section {
      margin-top: 24px;
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }
    .output-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
    }
    pre {
      background: #0f172a;
      color: #38bdf8;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="nav-bar">
      <a href="../index.html">← V8 Dashboard</a>
      <span>•</span>
      <a href="../table/index.html">Go to Table Sample →</a>
    </div>

    <span class="badge">V8 Separate Module</span>
    <h1>Form Sample</h1>
    <p class="subtitle">Extracts form fields via declarative JSON recipe pipeline</p>

    <form id="v8UserForm" onsubmit="return false;">
      <div class="field">
        <label for="fieldName">Name</label>
        <input id="fieldName" name="name" type="text" placeholder="Enter name" value="Keshav" required>
      </div>

      <div class="field">
        <label for="fieldMobile">Mobile Number</label>
        <input id="fieldMobile" name="mobile" type="tel" placeholder="Enter mobile" value="9876543210" required>
      </div>

      <div class="field">
        <label for="fieldCity">City</label>
        <select id="fieldCity" name="city">
          <option value="Hyderabad" selected>Hyderabad</option>
          <option value="Bengaluru">Bengaluru</option>
          <option value="Chennai">Chennai</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <div class="output-section">
      <div class="output-label">Extracted Form Object (Console & DOM)</div>
      <pre id="outputResult">// Click "Submit" to extract form data</pre>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
