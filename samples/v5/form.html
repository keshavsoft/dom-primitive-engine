<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM Primitive Engine V5 — Simple Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1e293b;
    }
    p.subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1e293b;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    button[type="submit"] {
      padding: 12px 18px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button[type="submit"]:hover {
      background: #1d4ed8;
    }
    button[type="submit"]:active {
      transform: scale(0.99);
    }
    .output-section {
      margin-top: 24px;
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }
    .output-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
    }
    pre {
      background: #0f172a;
      color: #38bdf8;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>DOM Primitive Engine (V5)</h1>
    <p class="subtitle">Extracts Name & Mobile via JSON instruction pipeline</p>

    <form id="userForm">
      <div class="field">
        <label for="fieldName">Name</label>
        <input id="fieldName" name="name" type="text" placeholder="e.g. John Doe" value="Keshav" required>
      </div>

      <div class="field">
        <label for="fieldMobile">Mobile Number</label>
        <input id="fieldMobile" name="mobile" type="tel" placeholder="e.g. 9876543210" value="9876543210" required>
      </div>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <div class="output-section">
      <div class="output-title">Extracted Form Object (Console & DOM)</div>
      <pre id="outputResult">// Click "Submit" to run instructions</pre>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
