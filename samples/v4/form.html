<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DOM Primitive Engine V3 — Form</title>
</head>

<body>
    <h1>V3 — Form extraction (JSON instructions)</h1>
    <form data-demo-form><label>Name <input name="name" value="Maya"></label><label>Email <input name="email"
                type="email" value="maya@example.com"></label><label>Active <input name="active" type="checkbox"
                value="yes" checked></label><label>Role <select name="role">
                <option value="dev" selected>Developer</option>
                <option value="analyst">Analyst</option>
            </select></label><button type="submit">Collect form data</button>
        <pre data-output></pre>
    </form>
    <script type="module" src="./main.js"></script>
</body>

</html>
