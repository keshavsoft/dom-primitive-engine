<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM Primitive Engine V9 — Instruction Pipeline</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
      color: #172033
    }

    section {
      border: 1px solid #d5dbe5;
      border-radius: 10px;
      padding: 18px;
      margin: 18px 0
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0
    }

    th,
    td {
      border: 1px solid #d5dbe5;
      padding: 9px;
      text-align: left
    }

    button {
      padding: 7px 12px;
      cursor: pointer
    }

    pre {
      white-space: pre-wrap;
      background: #f4f6f9;
      padding: 12px;
      border-radius: 8px
    }

    input {
      padding: 7px;
      margin: 5px
    }
  </style>
</head>

<body>
  <h1>DOM Primitive Engine V9</h1>
  <p>Demonstrates ordered instructions dispatched through the operation registry.</p>
  <section>
    <h2>Table row extraction</h2>
    <table id="products">
      <thead>
        <tr>
          <th>Item</th>
          <th>Category</th>
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Keyboard</td>
          <td>Accessories</td>
          <td>35</td>
          <td><button class="extract-row">Extract</button></td>
        </tr>
        <tr>
          <td>Mouse</td>
          <td>Accessories</td>
          <td>20</td>
          <td><button class="extract-row">Extract</button></td>
        </tr>
      </tbody>
    </table>
    <pre id="row-output">Click Extract on a row.</pre>
  </section>
  <section>
    <h2>Form extraction</h2>
    <form id="person-form">
      <label>Name <input name="name" value="Keshav"></label>
      <label>City <input name="city" value="Kakinada"></label>
      <button type="button" id="extract-form">Extract form</button>
    </form>
    <pre id="form-output">Click Extract form.</pre>
  </section>
  <script type="module">
    import { runPipeline } from "../../src/v9/index.js";

    const tableInstructions = [
      { op: "closest", args: { selector: "tr" } },
      { op: "queryAll", args: { selector: "td:not(:last-child)" } },
      {
        op: "toObject", args: {
          columns: ["itemName", "category", "price"],
          read: "text"
        }
      }
    ];

    document.querySelectorAll(".extract-row").forEach(button => {
      button.addEventListener("click", event => {
        const result = runPipeline(event.currentTarget, tableInstructions);
        document.querySelector("#row-output").textContent = JSON.stringify(result, null, 2);
      });
    });

    document.querySelector("#extract-form").addEventListener("click", event => {
      const result = runPipeline(event.currentTarget, [
        { op: "closest", args: { selector: "form" } },
        { op: "queryAll", args: { selector: "input[name]" } },
        { op: "toObject" }
      ]);
      document.querySelector("#form-output").textContent = JSON.stringify(result, null, 2);
    });
  </script>
</body>

</html>
